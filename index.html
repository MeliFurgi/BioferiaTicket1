<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bioferia Ticket1</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="screen">
  <header class="topbar">
    <button type="button" aria-label="Abrir menú">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <line x1="3" y1="6" x2="21" y2="6"/>
        <line x1="3" y1="12" x2="21" y2="12"/>
        <line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </button>
  </header>

  <div class="title-block">
    <h1>BIOFERIA</h1>
    <div class="year">2027</div>
  </div>

  <div class="ticket-wrap">
    <!-- Tocar el ticket = "escanear" (acá dispararías tu modal / cámara QR real) -->
    <button class="ticket" id="ticket" type="button" aria-label="Apretar para escanear código QR">
      <span class="ticket-art"></span>
      <span class="ticket-info">
      </span>
    </button>
    <p class="ticket-hint">Apretar ticket para escanear código QR</p>
  </div>

  <h2 class="section-heading">ENTRADA DIGITAL</h2>

  <div class="details">

    <div class="detail-row">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
        <rect x="3" y="5" width="18" height="16" rx="2"/>
        <line x1="3" y1="10" x2="21" y2="10"/>
        <line x1="8" y1="3" x2="8" y2="7"/>
        <line x1="16" y1="3" x2="16" y2="7"/>
      </svg>
      <div>
        <p class="label">FECHA</p>
        <p class="value">00 · 00 · 27</p>
      </div>
    </div>

    <div class="detail-row">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
        <path d="M12 21s7-6.1 7-11.5S16.4 3 12 3 5 4.6 5 9.5 12 21 12 21z"/>
        <circle cx="12" cy="9.5" r="2.3"/>
      </svg>
      <div>
        <p class="label">LUGAR</p>
        <p class="value">Centro Costa Salguero<br>Buenos Aires</p>
      </div>
    </div>

    <div class="detail-row">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
        <path d="M3 10a2 2 0 0 1 0-4V4h18v2a2 2 0 0 0 0 4v0a2 2 0 0 0 0 4v2H3v-2a2 2 0 0 0 0-4z"/>
      </svg>
      <div>
        <p class="label">TIPO DE ENTRADA</p>
        <p class="value">General</p>
      </div>
    </div>

    <hr class="divider">

    <div class="valid-pill">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
      ENTRADA VÁLIDA
    </div>

    <div class="code-block">
      <p class="label">CÓDIGO</p>
      <p class="value">BF-2027-001</p>
    </div>

  </div>

</div>

<script src="script.js"></script>
</body>
</html>
